<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c69253">
<title>Distance = Rate × Time Practice</title>
<style>
  :root {
    --primary: #ece6df;
    --secondary: #dbc9b3;
    --accent: #c69253;
    --accent-dark: #7d5425;
    --ink: #2f2a25;
    --muted: #6d645b;
    --surface: #fffdf9;
    --border: #cdbca8;
    --success: #2f6b45;
    --error: #9a3d35;
    --shadow: 0 8px 24px rgba(66, 48, 30, .09);
    --radius: 18px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at top left, rgba(219,201,179,.42), transparent 34rem),
      var(--primary);
    line-height: 1.5;
  }

  button, input, select { font: inherit; }
  button { cursor: pointer; }

  .app {
    width: min(1180px, calc(100% - 28px));
    margin: 0 auto;
    padding: 28px 0 48px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 24px;
    margin: 0;
    padding: 14px 0 12px;
  }

  .sticky-top {
    position: sticky;
    top: 0;
    z-index: 30;
    margin-bottom: 20px;
    padding: 0 0 2px;
    background: rgba(236,230,223,.97);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(205,188,168,.55);
  }

  .eyebrow {
    margin: 0 0 5px;
    font-size: .78rem;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent-dark);
  }

  h1 {
    margin: 0;
    font-size: clamp(1.75rem, 4vw, 3rem);
    line-height: 1.08;
    letter-spacing: -.035em;
  }

  .subtitle {
    margin: 9px 0 0;
    color: var(--muted);
    font-size: 1.02rem;
  }

  .primary-btn {
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-weight: 800;
    padding: 12px 18px;
    min-height: 46px;
    box-shadow: 0 4px 10px rgba(125,84,37,.18);
    transition: transform .15s ease, filter .15s ease;
    white-space: nowrap;
  }

  .primary-btn:hover { filter: brightness(.96); transform: translateY(-1px); }
  .primary-btn:active { transform: translateY(0); }
  .primary-btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid rgba(198,146,83,.42);
    outline-offset: 2px;
  }

  .progress {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0;
    padding: 0 0 13px;
    color: var(--muted);
    font-size: .9rem;
    font-weight: 700;
  }
  .progress-bar {
    height: 8px;
    flex: 1;
    background: rgba(255,255,255,.65);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .25s ease;
  }

  .problems {
    display: grid;
    gap: 20px;
  }

  .problem {
    background: rgba(255,253,249,.94);
    border: 1px solid rgba(205,188,168,.9);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .problem-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    background: var(--secondary);
    border-bottom: 1px solid rgba(125,84,37,.12);
  }

  .problem-number {
    font-weight: 900;
    letter-spacing: .02em;
  }

  .status {
    min-height: 25px;
    font-size: .88rem;
    font-weight: 800;
  }

  .question {
    padding: 22px 20px 8px;
    font-size: clamp(1.03rem, 2vw, 1.18rem);
    font-weight: 700;
  }

  .work-area {
    padding: 16px 20px 22px;
    display: grid;
    gap: 20px;
  }

  .section-title {
    margin: 0 0 10px;
    font-size: .92rem;
    font-weight: 900;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .055em;
  }

  .choices {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
  }

  .choice {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--ink);
    border-radius: 12px;
    padding: 11px 10px;
    font-weight: 800;
    min-height: 46px;
    transition: .15s ease;
  }

  .choice:hover { border-color: var(--accent); background: #fffaf3; }
  .choice.selected {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .equation-card {
    background: var(--primary);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 18px;
  }

  .equation {
    min-height: 82px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: clamp(1.2rem, 3vw, 1.7rem);
    font-weight: 900;
  }

  .eq-var { min-width: 1.3em; text-align: center; }
  .eq-equals, .eq-symbol { margin: 0 2px; }

  .equation-answer {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-left: 8px;
  }

  .equation-check {
    min-height: 44px;
    border: 1px solid var(--accent);
    background: #fff8ed;
    color: var(--accent-dark);
    border-radius: 10px;
    padding: 8px 13px;
    font-weight: 900;
    white-space: nowrap;
  }

  .equation-check:hover { background: var(--secondary); }

  .field-wrap {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .number-input {
    width: 112px;
    min-height: 46px;
    padding: 8px 10px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: #fff;
    text-align: center;
    font-weight: 800;
    color: var(--ink);
  }

  .number-input::placeholder {
    color: #aaa;
    font-weight: 600;
    font-size: .78rem;
  }

  .unit {
    color: var(--accent-dark);
    font-size: .86rem;
    font-weight: 800;
    white-space: nowrap;
  }

  .fraction-inline {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }

  .fraction-slash {
    font-weight: 900;
    font-size: 1.35em;
  }

  .unit-area {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 14px;
    align-items: end;
  }

  .select-label {
    display: grid;
    gap: 7px;
    font-weight: 800;
  }

  select {
    min-height: 46px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    padding: 8px 12px;
    font-weight: 700;
  }

  .answer-row {
    display: none;
    flex-wrap: wrap;
    gap: 12px;
  }

  .answer-row-old {
    display: flex;
    align-items: end;
    flex-wrap: wrap;
    gap: 12px;
  }

  .answer-label {
    display: grid;
    gap: 7px;
    font-weight: 800;
  }

  .check-btn {
    min-height: 46px;
    border: 1px solid var(--accent);
    background: #fff8ed;
    color: var(--accent-dark);
    border-radius: 10px;
    padding: 9px 16px;
    font-weight: 900;
  }
  .check-btn:hover { background: var(--secondary); }

  .feedback {
    min-height: 25px;
    font-weight: 900;
  }
  .feedback.correct { color: var(--success); }
  .feedback.incorrect { color: var(--error); }

  .hidden { display: none !important; }

  footer {
    margin-top: 24px;
    text-align: center;
    color: var(--muted);
    font-size: .84rem;
  }

  @media (max-width: 760px) {
    .app { width: min(100% - 18px, 680px); padding-top: 8px; }
    .equation { justify-content: flex-start; }
    .answer-input { width: 88px; }
    .equation-check { width: auto; }
    header {
      align-items: stretch;
      flex-direction: column;
      gap: 14px;
    }
    .primary-btn { width: 100%; }
    .choices { grid-template-columns: 1fr; }
    .unit-area { grid-template-columns: 1fr; }
    .equation-card { padding: 14px 10px; }
    .equation { justify-content: flex-start; }
    .number-input { width: 92px; }
    .answer-row { align-items: stretch; flex-direction: column; }
    .check-btn { width: 100%; }
  }

  @media (max-width: 430px) {
    .problem-top, .question, .work-area { padding-left: 14px; padding-right: 14px; }
    .equation { font-size: 1.15rem; gap: 5px; }
    .number-input { width: 82px; }
    .unit { font-size: .75rem; }
    .fraction-inline { gap: 4px; }
  }
</style>
</head>
<body>
<main class="app">
  <div class="sticky-top">
    <header>
      <div>
        <h1>Distance = Rate × Time Practice Problems</h1>
        <p class="subtitle"><strong>Type into the equation and solve.</strong></p>
      </div>
      <button class="primary-btn" id="newSetBtn" type="button">New Problem Set</button>
    </header>

    <div class="progress" aria-label="Problem progress">

    </div>
  </div>

  <section class="problems" id="problems" aria-live="polite"></section>

  <footer>Choose what you are finding, build the equation, select your units, and check your answer.</footer>
</main>

const RATE_UNITS = {
  "miles per hour": { distance: "miles", time: "hours", rate: "miles/hour" },
  "feet per second": { distance: "feet", time: "seconds", rate: "feet/second" },
  "kilometers per hour": { distance: "kilometers", time: "hours", rate: "kilometers/hour" },
  "meters per second": { distance: "meters", time: "seconds", rate: "meters/second" }
};

let currentProblems = [];

function shuffle(array) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function makeProblemState(question) {
  return {
    data: question,
    selectedTarget: "",
    selectedRateUnit: "",
    values: { first: "", second: "" },
    answer: "",
    status: ""
  };
}

function newProblemSet() {
  currentProblems = shuffle(QUESTION_BANK).slice(0, 5).map(makeProblemState);
  renderProblems();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function targetLabel(target) {
  return { d: "Distance", r: "Rate", t: "Time" }[target];
}

function renderProblems() {
  const container = document.getElementById("problems");
  container.innerHTML = currentProblems.map((p, index) => renderProblem(p, index)).join("");
  attachHandlers();
  updateProgress();
}

function renderProblem(p, index) {
  const target = p.selectedTarget;
  const unitInfo = p.selectedRateUnit ? RATE_UNITS[p.selectedRateUnit] : null;
  const answerUnit = unitInfo
    ? (p.selectedTarget === "d" ? unitInfo.distance :
       p.selectedTarget === "r" ? unitInfo.rate :
       unitInfo.time)
    : "";
  const fields = equationFields(p, target, unitInfo);

  return `
    <article class="problem" data-index="${index}">
      <div class="problem-top">
        <div class="problem-number">Problem ${index + 1}</div>
        <div class="status" aria-live="polite">${p.status === "correct" ? "✓ Correct" : p.status === "incorrect" ? "↺ Try again" : ""}</div>
      </div>

      <div class="question">${escapeHtml(p.data.question)}</div>

      <div class="work-area">
        <section>
          <h2 class="section-title">I am trying to find...</h2>
          <div class="choices" role="group" aria-label="Choose what you are finding">
            ${["d","r","t"].map(v => `
              <button type="button" class="choice ${target === v ? "selected" : ""}" data-action="target" data-value="${v}">
                ${targetLabel(v)}
              </button>
            `).join("")}
          </div>
        </section>

        <section class="equation-card" aria-label="Equation">
          <h2 class="section-title">Equation</h2>
          <div class="equation">
            ${target ? fields : `<span style="color:var(--muted);font-size:.95rem;font-weight:700">Choose Distance, Rate, or Time to build your equation.</span>`}
          </div>
        </section>

        <section class="unit-area">
          <label class="select-label">
            My rate is measured in...
            <select data-action="unit" aria-label="Select rate unit">
              <option value="">Select a rate unit...</option>
              ${Object.keys(RATE_UNITS).map(unit => `<option value="${unit}" ${p.selectedRateUnit === unit ? "selected" : ""}>${unit}</option>`).join("")}
            </select>
          </label>
          ${unitInfo ? `<div class="unit" aria-live="polite">Distance: ${unitInfo.distance} · Time: ${unitInfo.time} · Rate: ${p.selectedRateUnit}</div>` : `<div class="unit" style="color:var(--muted)">Units appear after you choose a rate unit.</div>`}
        </section>

        <div class="feedback ${p.status}" aria-live="polite">
          ${p.status === "correct" ? "Correct!" : p.status === "incorrect" ? "Incorrect. Try again." : ""}
        </div>
      </div>
    </article>
  `;
}

function inputHTML(p, key, placeholder, unit) {
  return `<span class="field-wrap">
    <input class="number-input equation-input" data-key="${key}" data-action="value" type="number" step="any" inputmode="decimal" placeholder="${placeholder}" value="${p.values[key]}">
    ${unit ? `<span class="unit">${unit}</span>` : ""}
  </span>`;
}

function fractionHTML(p, topKey, bottomKey, topUnit, bottomUnit, topCategory, bottomCategory) {
  return `<span class="fraction-inline">
    ${inputHTML(p, topKey, topCategory, topUnit)}
    <span class="fraction-slash">/</span>
    ${inputHTML(p, bottomKey, bottomCategory, bottomUnit)}
  </span>`;
}

function answerHTML(p, answerUnit) {
  return `<span class="equation-answer">
    <span class="eq-equals">=</span>
    <input class="number-input answer-input" data-action="answer" type="number" step="any" inputmode="decimal" placeholder="Answer" value="${p.answer}">
    <span class="unit">${answerUnit || ""}</span>
    <button type="button" class="equation-check" data-action="check">Check Answer</button>
  </span>`;
}

function equationFields(p, target, unitInfo) {
  const u = unitInfo;
  // Units stay hidden until a rate unit is selected. Once selected, every
  // equation field gets its matching unit immediately beside the field.
  if (!u) {
    return `<span style="color:var(--muted);font-size:.95rem;font-weight:700">Choose a rate unit to show the units and finish the equation.</span>`;
  }

  if (target === "d") {
    return `
      <span class="eq-var">d</span><span class="eq-equals">=</span>
      ${inputHTML(p, "first", "Rate", p.selectedRateUnit)}
      <span class="eq-symbol">×</span>
      ${inputHTML(p, "second", "Time", u.time)}
      ${answerHTML(p, u.distance)}
    `;
  }
  if (target === "r") {
    return `
      <span class="eq-var">r</span><span class="eq-equals">=</span>
      ${fractionHTML(p, "first", "second", u.distance, u.time, "Distance", "Time")}
      ${answerHTML(p, p.selectedRateUnit)}
    `;
  }
  return `
    <span class="eq-var">t</span><span class="eq-equals">=</span>
    ${fractionHTML(p, "first", "second", u.distance, u.rate, "Distance", "Rate")}
    ${answerHTML(p, u.time)}
  `;
}

function attachHandlers() {
  document.querySelectorAll(".problem").forEach(card => {
    const index = Number(card.dataset.index);
    const p = currentProblems[index];

    card.querySelectorAll('[data-action="target"]').forEach(button => {
      button.addEventListener("click", () => {
        p.selectedTarget = button.dataset.value;
        p.values = { first: "", second: "" };
        p.answer = "";
        p.status = "";
        renderProblems();
      });
    });

    const unitSelect = card.querySelector('[data-action="unit"]');
    unitSelect.addEventListener("change", event => {
      p.selectedRateUnit = event.target.value;
      p.status = "";
      renderProblems();
    });

    card.querySelectorAll('[data-action="value"]').forEach(input => {
      input.addEventListener("input", event => {
        p.values[input.dataset.key] = event.target.value;
        p.status = "";
      });
    });

    const answerInput = card.querySelector('[data-action="answer"]');
    if (answerInput) {
      answerInput.addEventListener("input", event => {
        p.answer = event.target.value;
        p.status = "";
        const feedback = card.querySelector(".feedback");
        feedback.textContent = "";
        feedback.className = "feedback";
        card.querySelector(".status").textContent = "";
        updateProgress();
      });
    }

    const checkButton = card.querySelector('[data-action="check"]');
    if (checkButton) checkButton.addEventListener("click", () => {
      const student = Number(p.answer);
      const correct = Number(p.data.answer);
      const tolerance = Math.max(0.000001, Math.abs(correct) * 0.0001);

      if (p.answer.trim() !== "" && Number.isFinite(student) && Math.abs(student - correct) <= tolerance) {
        p.status = "correct";
      } else {
        p.status = "incorrect";
      }
      renderProblems();
    });
  });
}

function updateProgress() {
  const checked = currentProblems.filter(p => p.status === "correct").length;
  document.getElementById("progressText").textContent = `${checked} of 5 checked`;
  document.getElementById("progressFill").style.width = `${checked / 5 * 100}%`;
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  })[char]);
}

document.getElementById("newSetBtn").addEventListener("click", newProblemSet);
newProblemSet();
</script>
